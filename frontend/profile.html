<!DOCTYPE html>
<html lang="en" data-requires-login>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-i18n="prof.doctitle">Profile | MEDIC CARE</title>
  <script src="auth.js"></script>
  <script src="languages.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
:root {
  --bg-gradient: linear-gradient(180deg, #2b56cb 0%, #3b6bdc 30%, #a2b7e8 70%, #d8e2f8 100%);
  --card-bg: #ffffff;
  --input-border: #dcdcdc;
  --input-bg: #ffffff;
  --text-primary: #333333;
  --text-secondary: #666666;
  --btn-blue: #2f6bf6;
  --error: #c0182b;
  --border-radius: 20px;
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  font-family: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  -webkit-tap-highlight-color: transparent;
}

body {
  min-height: 100vh;
  background: var(--bg-gradient);
}

button:focus-visible { outline: 3px solid #5b7bd6; outline-offset: 2px; }
.sidebar :focus-visible { outline-color: #fff; }

/* same width + side spacing as the dashboard */
.app-container {
  width: 100%;
  max-width: 980px;
  margin: 0 auto;
  padding: 18px min(4.4%, 43.12px) 60px;
  display: flex;
  flex-direction: column;
  gap: 24px;
}

/* ===== Header (same as dashboard) ===== */
.topbar {
  display: flex; align-items: center; justify-content: space-between;
  height: 38px; padding: 0 16px;
  background: #b4bfdc;
  border-radius: 999px;
}
.icon-btn { background: none; border: 0; color: #1b3a8f; padding: 6px; display: grid; place-items: center; border-radius: 8px; cursor: pointer; }
.brand { display: flex; align-items: center; gap: 6px; }
.brand-name { font-weight: 800; font-size: 22px; letter-spacing: .3px; color: #0e2a7d; }

/* ===== Sidebar (same as the other pages) ===== */
.scrim { position: fixed; inset: 0; background: rgba(10, 18, 50, .45); opacity: 0; pointer-events: none; transition: opacity .25s; z-index: 40; }
.scrim.open { opacity: 1; pointer-events: auto; }
.sidebar {
  position: fixed; top: 0; left: 0; bottom: 0; width: min(290px, 86vw); z-index: 50;
  display: flex; flex-direction: column; padding: 20px 18px 28px;
  background: #142a6b; box-shadow: 4px 0 22px rgba(10, 20, 60, .35);
  transform: translateX(-100%); visibility: hidden;
  transition: transform .35s cubic-bezier(.22, .61, .36, 1), visibility 0s linear .35s;
}
.sidebar.open { transform: none; visibility: visible; transition-delay: 0s; }
.side-profile { display: flex; align-items: center; gap: 12px; color: #fff; padding: 0 2px; }
.side-avatar {
  width: 40px; height: 40px; border-radius: 50%; flex: none; display: grid; place-items: center; overflow: hidden;
  background: #2a9a92; color: #fff; font-weight: 700; font-size: 16px;
}
.side-avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }
.side-info { display: flex; flex-direction: column; min-width: 0; }
.side-info strong { font-size: 17px; font-weight: 600; line-height: 1.2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.side-info span { font-size: 11.5px; font-weight: 500; letter-spacing: .3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sidebar .icon-btn.light { margin-left: auto; color: #aab7de; font-size: 28px; padding: 2px 8px; }
.sidebar .icon-btn.light:hover { color: #fff; }
.sidebar hr { border: 0; border-top: 2px solid #8d98bd; margin: 18px 0 20px; opacity: .8; }
.side-search {
  display: flex; align-items: center; gap: 12px; padding: 11px 14px; margin-bottom: 18px;
  background: #2b4380; border-radius: 8px; color: #a3b0d6;
}
.side-search svg { width: 24px; height: 24px; flex: none; }
.side-search input { flex: 1; min-width: 0; background: none; border: 0; outline: 0; color: #fff; font-size: 17px; font-weight: 500; padding: 0; }
.side-search input::placeholder { color: #a3b0d6; opacity: 1; }
.side-search input::-webkit-search-cancel-button { filter: invert(1); opacity: .6; }
.side-search:focus-within { box-shadow: 0 0 0 2px #7f9df0; }
.sidebar nav { flex: 1; overflow-y: auto; }
.sidebar nav a, .logout {
  display: flex; align-items: center; gap: 22px; padding: 10px 10px; margin-bottom: 4px;
  color: #fff; text-decoration: none; font-weight: 600; font-size: 15px; border-radius: 8px; transition: background .15s;
}
.sidebar nav a svg, .logout svg { width: 24px; height: 24px; flex: none; color: #8997c4; }
.sidebar nav a:hover, .logout:hover { background: rgba(255, 255, 255, .09); }
.sidebar nav a.active { background: rgba(255, 255, 255, .15); }
.sidebar nav a.active svg { color: #fff; }
.sidebar nav a[hidden] { display: none; }
.no-match { color: #a3b0d6; font-size: 14px; padding: 8px 10px; margin: 0; }
.icon-btn.light { color: #fff; font-size: 30px; line-height: 1; margin-left: auto; }

/* ===== User details card ===== */
.user-details-card {
  background-color: var(--card-bg);
  border-radius: var(--border-radius);
  padding: 20px 24px;
  box-shadow: 0 8px 24px rgba(0, 0, 0, 0.12);
  width: 100%;
  max-height: 85vh;
  overflow-y: auto;
}

.card-top-bar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 16px;
}

.card-title {
  font-size: 16px;
  font-weight: 700;
  color: var(--text-primary);
}

.profile-avatar {
  width: 44px;
  height: 44px;
  border-radius: 50%;
  background-color: #d1d5db;
  color: #1f2937;
  font-size: 14px;
  font-weight: 700;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  text-transform: uppercase;
  user-select: none;
}
.profile-avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }

.input-group {
  margin-bottom: 12px;
  text-align: left;
}

.input-group label,
.input-group .group-label {
  display: block;
  font-size: 11px;
  font-weight: 600;
  color: var(--text-primary);
  margin-bottom: 4px;
}

.input-wrapper {
  position: relative;
  display: flex;
  align-items: center;
  background-color: var(--input-bg);
  border: 1px solid var(--input-border);
  border-radius: 12px;
  padding: 0 12px;
  height: 38px;
}

.input-wrapper:focus-within {
  border-color: var(--btn-blue);
  box-shadow: 0 0 0 2px rgba(47, 107, 246, 0.2);
}

.input-wrapper.invalid {
  border-color: var(--error);
}

.input-wrapper input {
  width: 100%;
  background: none;
  border: none;
  outline: none;
  font-size: 12px;
  color: var(--text-primary);
}

.msg {
  color: var(--error);
  font-size: 11px;
  margin: 4px 0 0 4px;
}
.msg:empty { display: none; }

.phone-wrapper {
  padding-left: 6px;
}

.country-code {
  display: flex;
  align-items: center;
  gap: 4px;
  font-size: 11px;
  color: var(--text-primary);
  padding-right: 6px;
  margin-right: 6px;
  border-right: 1px solid #e2e8f0;
  user-select: none;
  height: 100%;
}

.flag {
  font-size: 12px;
}

.arrow-down {
  font-size: 8px;
  color: var(--text-secondary);
}

.bottom-fields-grid {
  display: grid;
  grid-template-columns: 120px 1fr;
  gap: 12px;
  align-items: start;
}

.bday-select-grid {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  gap: 6px;
}

.select-wrapper {
  padding: 0 8px;
}

.select-wrapper select {
  width: 100%;
  background: none;
  border: none;
  outline: none;
  font-size: 10px;
  font-weight: 600;
  color: var(--text-secondary);
  cursor: pointer;
  appearance: none;
  -webkit-appearance: none;
}

.select-arrow {
  position: absolute;
  right: 8px;
  pointer-events: none;
}

.btn-container {
  display: flex;
  justify-content: flex-end;
  margin-top: 18px;
}

.form-msg {
  text-align: right;
  margin-top: 14px;
}

.save-btn {
  background-color: var(--btn-blue);
  color: #ffffff;
  border: none;
  border-radius: 20px;
  padding: 10px 24px;
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
  transition: background-color 0.2s;
}

.save-btn:hover {
  background-color: #1a56db;
}

/* Success view */
.success-container {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 24px 10px;
}

.success-icon-box {
  width: 50px;
  height: 50px;
  border-radius: 50%;
  background: #dcfce7;
  color: #16a34a;
  font-size: 24px;
  font-weight: bold;
  display: flex;
  align-items: center;
  justify-content: center;
  margin-bottom: 12px;
}

.success-title {
  font-size: 16px;
  font-weight: 700;
  color: #1e293b;
  margin-bottom: 6px;
}

.success-desc {
  font-size: 11px;
  color: #64748b;
  margin-bottom: 18px;
  max-width: 260px;
  line-height: 1.4;
}

@media (max-width: 580px) {
  .bottom-fields-grid {
    grid-template-columns: 1fr;
  }
}

/* Reduced motion: also applies to the sidebar and scrim, which open/close instantly */
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; } }
  </style>
</head>
<body>

  <!-- Sidebar -->
  <div class="scrim" id="scrim"></div>
  <aside class="sidebar" id="sidebar" aria-label="Main navigation" aria-hidden="true">
    <div class="side-profile">
      <div class="side-avatar" id="sideAvatar">FP</div>
      <div class="side-info">
        <strong id="sideName">Final Project</strong>
        <span id="sideEmail">finalproject@gmail.com</span>
      </div>
      <button class="icon-btn light" id="closeSidebar" aria-label="Close menu" data-i18n-aria="menu.close">&times;</button>
    </div>
    <hr>
    <label class="side-search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.200" stroke-linecap="round" aria-hidden="true"><circle cx="10.500" cy="10.500" r="6.500"/><path d="m20 20-4.800-4.800"/></svg>
      <input type="search" id="navSearch" placeholder="Search..." data-i18n-ph="nav.search" aria-label="Search menu" autocomplete="off">
    </label>
    <nav id="nav">
      <a href="index.html"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M3 11.500 12 3l9 8.500V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg><span data-i18n="nav.dashboard">Dashboard</span></a>
      <a href="profile.html" class="active" aria-current="page"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="12" cy="7.500" r="4.500"/><path d="M3.500 21c0-4.500 3.800-7 8.500-7s8.500 2.500 8.500 7z"/></svg><span data-i18n="nav.profile">Profile</span></a>
      <a href="appointment.html"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path fill-rule="evenodd" d="M7 2v2H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2h-2V2h-2v2H9V2zM5 9h14v11H5z"/><path d="M7 11h2v2H7zm4 0h2v2h-2zm4 0h2v2h-2zM7 15h2v2H7zm4 0h2v2h-2z"/></svg><span data-i18n="nav.appointment">Appointment</span></a>
      <a href="medical_history.html"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8zm2 16H8v-2h8zm0-4H8v-2h8zm-3-5V3.500L18.500 9z"/></svg><span data-i18n="nav.history">Medical History</span></a>
      <a href="settings.html"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M19.140 12.940c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.030-1.580a.49.49 0 0 0 .12-.61l-1.920-3.320a.488.488 0 0 0-.59-.22l-2.390.96c-.5-.38-1.030-.7-1.620-.94l-.36-2.540a.484.484 0 0 0-.48-.41h-3.840c-.24 0-.43.17-.47.41l-.36 2.540c-.59.24-1.130.57-1.620.94l-2.390-.96c-.22-.08-.47 0-.59.22L2.740 8.870c-.12.21-.08.47.12.61l2.030 1.580c-.05.3-.09.63-.09.94s.02.64.07.94l-2.030 1.580a.49.49 0 0 0-.12.61l1.920 3.320c.12.22.37.29.59.22l2.390-.96c.5.38 1.030.7 1.620.94l.36 2.540c.05.24.24.41.48.41h3.840c.24 0 .44-.17.47-.41l.36-2.540c.59-.24 1.130-.56 1.620-.94l2.390.96c.22.08.47 0 .59-.22l1.920-3.320c.12-.22.07-.47-.12-.61zM12 15.600c-1.980 0-3.600-1.620-3.600-3.600s1.620-3.600 3.600-3.600 3.600 1.620 3.600 3.600-1.620 3.600-3.600 3.600z"/></svg><span data-i18n="nav.settings">Settings</span></a>
      <p class="no-match" id="noMatch" hidden data-i18n="nav.nomatch">No matching pages</p>
    </nav>
    <a href="login.html" class="logout"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.200" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 3h5a1 1 0 0 1 1 1v16a1 1 0 0 1-1 1h-5M8 8l-4 4 4 4M4 12h11"/></svg><span data-i18n="nav.logout">Logout</span></a>
  </aside>

  <div class="app-container">
    <header class="topbar">
      <button class="icon-btn" id="menuBtn" type="button" aria-label="Open menu" data-i18n-aria="menu.open" aria-expanded="false" aria-controls="sidebar">
        <svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true"><path d="M2 5h18M2 11h18M2 17h18" stroke="currentColor" stroke-width="3" stroke-linecap="round"/></svg>
      </button>
      <div class="brand">
        <span class="brand-name">MEDIC CARE</span>
        <svg class="brand-logo" width="30" height="34" viewBox="0 0 34 38" aria-hidden="true">
          <defs><linearGradient id="sg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2fb4c9"/><stop offset="1" stop-color="#2b4fb8"/></linearGradient></defs>
          <path d="M17 1.5 31 6.5v11c0 9-6 15.5-14 19C9 33 3 26.500 3 17.500v-11z" fill="url(#sg)" stroke="#223c93" stroke-width="2"/>
          <path d="M17 8.500 26 12v6c0 5.500-3.500 9.500-9 12-5.500-2.500-9-6.500-9-12v-6z" fill="#dff3f7" opacity=".35"/>
          <path d="M14.500 12.500h5v4h4v5h-4v4h-5v-4h-4v-5h4z" fill="#fff"/>
        </svg>
      </div>
    </header>

    <main class="user-details-card">
      <!-- Form view -->
      <div id="formView">
        <div class="card-top-bar">
          <h1 class="card-title" data-i18n="prof.h1">Profile</h1>
          <div class="profile-avatar" id="avatarInitials" aria-hidden="true">--</div>
        </div>

        <form id="userDetailsForm" novalidate>
          <div class="input-group">
            <label for="fullName" data-i18n="prof.name">Full Name</label>
            <div class="input-wrapper">
              <input type="text" id="fullName" maxlength="200" autocomplete="name" placeholder="Full name" data-i18n-ph="prof.ph.name">
            </div>
            <div class="msg" id="nameMsg"></div>
          </div>

          <div class="input-group">
            <label for="email" data-i18n="prof.email">Email Address</label>
            <div class="input-wrapper">
              <input type="email" id="email" autocomplete="email" placeholder="name@email.com" data-i18n-ph="prof.ph.email">
            </div>
            <div class="msg" id="emailMsg"></div>
          </div>

          <div class="input-group">
            <label for="phone" data-i18n="prof.phone">Phone Number</label>
            <div class="input-wrapper phone-wrapper">
              <div class="country-code" role="group" aria-label="Country code" data-i18n-aria="prof.code">
                <span class="flag" aria-hidden="true">🇵🇭</span>
                <span>+63</span>
              </div>
              <input type="tel" id="phone" inputmode="tel" autocomplete="tel-national" placeholder="9123456789">
            </div>
            <div class="msg" id="phoneMsg"></div>
          </div>

          <div class="input-group">
            <label for="altPhone" data-l="label.alt">Alternative Number</label>
            <div class="input-wrapper phone-wrapper">
              <div class="country-code" role="group" aria-label="Country code" data-i18n-aria="prof.code">
                <span class="flag" aria-hidden="true">🇵🇭</span>
                <span>+63</span>
              </div>
              <input type="tel" id="altPhone" inputmode="tel" placeholder="9123456789">
            </div>
            <div class="msg" id="altPhoneMsg"></div>
          </div>

          <div class="input-group">
            <label for="address" data-l="label.address">Address</label>
            <div class="input-wrapper">
              <input type="text" id="address" autocomplete="street-address" placeholder="Enter complete address" data-l-ph="ph.address">
            </div>
          </div>

          <div class="bottom-fields-grid">
            <div class="input-group">
              <label for="gender" data-l="label.gender">Gender</label>
              <div class="input-wrapper select-wrapper">
                <select id="gender">
                  <option value="" disabled selected></option>
                  <option value="Male" data-l="opt.male">Male</option>
                  <option value="Female" data-l="opt.female">Female</option>
                   <option value="Prefer Not To Say" data-l="opt.prefer">Prefer not to say</option>
                </select>
                <span class="arrow-down select-arrow" aria-hidden="true">&#9660;</span>
              </div>
            </div>

            <div class="input-group">
              <span class="group-label" id="bdayLabel" data-l="label.bday">Birth Date</span>
              <div class="bday-select-grid" role="group" aria-labelledby="bdayLabel">
                <div class="input-wrapper select-wrapper">
                  <select id="bdayMonth" data-l-aria="opt.month" aria-label="MONTH">
                    <option value="" disabled selected data-l="opt.month">MONTH</option>
                  </select>
                  <span class="arrow-down select-arrow" aria-hidden="true">&#9660;</span>
                </div>

                <div class="input-wrapper select-wrapper">
                  <select id="bdayDay" data-l-aria="opt.day" aria-label="DAY">
                    <option value="" disabled selected data-l="opt.day">DAY</option>
                  </select>
                  <span class="arrow-down select-arrow" aria-hidden="true">&#9660;</span>
                </div>

                <div class="input-wrapper select-wrapper">
                  <select id="bdayYear" data-l-aria="opt.year" aria-label="YEAR">
                    <option value="" disabled selected data-l="opt.year">YEAR</option>
                  </select>
                  <span class="arrow-down select-arrow" aria-hidden="true">&#9660;</span>
                </div>
              </div>
              <div class="msg" id="bdayMsg"></div>
            </div>
          </div>

          <div class="msg form-msg" id="saveMsg" role="alert"></div>

          <div class="btn-container">
            <button type="submit" class="save-btn" data-i18n="prof.save">Save Changes</button>
          </div>
        </form>
      </div>

      <!-- Success view (hidden until the profile is saved) -->
      <div id="successView" class="success-container" style="display: none;" role="status">
        <div class="success-icon-box" aria-hidden="true">✓</div>
        <h2 class="success-title" data-i18n="prof.saved">Changes saved</h2>
        <p class="success-desc" data-l="done.desc">Your profile details have been successfully updated and saved.</p>
        <div class="btn-container" style="justify-content: center; width: 100%;">
          <button type="button" class="save-btn" id="backToEditBtn" data-l="done.back">Back to Profile</button>
        </div>
      </div>
    </main>
  </div>

  <script>
/* Profile page. Needs auth.js and languages.js loaded first.
   The account (name, email, phone) is saved with Auth.saveProfile();
   the other details are saved with Auth.setData("profileExtra"). */

const byId = (id) => document.getElementById(id);

/* ===== Text that has no entry in languages.js yet ===== */
const LOCAL = {
  "label.alt":     { en: "Alternative Number", fil: "Alternatibong Numero" },
  "label.address": { en: "Address", fil: "Tirahan" },
  "label.gender":     { en: "Gender", fil: "Kasarian" },
  "label.bday":    { en: "Birth Date", fil: "Petsa ng Kapanganakan" },
  "opt.male":      { en: "Male", fil: "Lalaki" },
  "opt.female":    { en: "Female", fil: "Babae" },
  "opt.prefer":    { en: "Prefer not to say", fil: "Mas pipiliing huwag sabihin" },
  "opt.month":     { en: "MONTH", fil: "BUWAN" },
  "opt.day":       { en: "DAY", fil: "ARAW" },
  "opt.year":      { en: "YEAR", fil: "TAON" },
  "ph.address":    { en: "Enter complete address", fil: "Ilagay ang kumpletong address" },
  "done.desc": {
    en: "Your profile details have been successfully updated and saved.",
    fil: "Matagumpay na na-update at na-save ang mga detalye ng iyong profile."
  },
  "done.back":     { en: "Back to Profile", fil: "Bumalik sa Profile" },
  "err.bday.incomplete": { en: "Choose the month, day and year.", fil: "Piliin ang buwan, araw at taon." },
  "err.bday.invalid":    { en: "That date doesn't exist.", fil: "Walang ganoong petsa." },
  "err.bday.future":     { en: "Birth date can't be in the future.", fil: "Hindi puwedeng nasa hinaharap ang petsa ng kapanganakan." },
  "err.save": {
    en: "We couldn't save your changes. Please try again.",
    fil: "Hindi na-save ang iyong mga pagbabago. Subukan muli."
  }
};

const MONTHS = {
  en: ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"],
  fil: ["Enero", "Pebrero", "Marso", "Abril", "Mayo", "Hunyo", "Hulyo", "Agosto", "Setyembre", "Oktubre", "Nobyembre", "Disyembre"]
};

function tr(key, vars) {
  if (LOCAL[key]) return LOCAL[key][I18N.getLang()] || LOCAL[key].en;
  return I18N.t(key, vars);
}

function paintLocal() {
  document.querySelectorAll("[data-l]").forEach((el) => { el.textContent = tr(el.dataset.l); });
  document.querySelectorAll("[data-l-ph]").forEach((el) => { el.placeholder = tr(el.dataset.lPh); });
  document.querySelectorAll("[data-l-aria]").forEach((el) => { el.setAttribute("aria-label", tr(el.dataset.lAria)); });
}

/* ===== Birth date dropdowns ===== */
function fillMonths() {
  const sel = byId("bdayMonth");
  const keep = sel.value;
  const names = MONTHS[I18N.getLang()] || MONTHS.en;

  while (sel.options.length > 1) sel.remove(1);

  names.forEach((name, i) => {
    const opt = document.createElement("option");
    opt.value = String(i + 1);
    opt.textContent = name;
    sel.appendChild(opt);
  });

  sel.value = keep;
}

function fillDaysAndYears() {
  const day = byId("bdayDay");
  const year = byId("bdayYear");

  for (let d = 1; d <= 31; d++) {
    const opt = document.createElement("option");
    opt.value = String(d);
    opt.textContent = String(d);
    day.appendChild(opt);
  }

  const thisYear = new Date().getFullYear();
  for (let y = thisYear; y >= 1940; y--) {
    const opt = document.createElement("option");
    opt.value = String(y);
    opt.textContent = String(y);
    year.appendChild(opt);
  }
}

/* ===== Errors (stored as translation keys so they follow the language) ===== */
const FIELDS = {
  name:     { input: "fullName", msg: "nameMsg" },
  email:    { input: "email", msg: "emailMsg" },
  phone:    { input: "phone", msg: "phoneMsg" },
  altPhone: { input: "altPhone", msg: "altPhoneMsg" },
  bday:     { input: "bdayMonth", msg: "bdayMsg", boxes: ["bdayMonth", "bdayDay", "bdayYear"] },
  form:     { msg: "saveMsg" }
};
const FOCUS_ORDER = ["name", "email", "phone", "altPhone", "bday"];
const errs = {};

function boxesOf(key) {
  const f = FIELDS[key];
  const ids = f.boxes || (f.input ? [f.input] : []);
  return ids.map((id) => byId(id).closest(".input-wrapper"));
}

function setErr(key, msgKey) {
  errs[key] = msgKey || null;
  byId(FIELDS[key].msg).textContent = msgKey ? tr(msgKey) : "";
  boxesOf(key).forEach((box) => box.classList.toggle("invalid", !!msgKey));
}

function clearAll() {
  Object.keys(FIELDS).forEach((key) => setErr(key, ""));
}

function repaintErrors() {
  Object.keys(errs).forEach((key) => {
    if (errs[key]) byId(FIELDS[key].msg).textContent = tr(errs[key]);
  });
}

// Editing a field clears only that field's error (and the general save error)
Object.keys(FIELDS).forEach((key) => {
  const f = FIELDS[key];
  (f.boxes || (f.input ? [f.input] : [])).forEach((id) => {
    ["input", "change"].forEach((evt) => {
      byId(id).addEventListener(evt, () => {
        setErr(key, "");
        setErr("form", "");
      });
    });
  });
});

/* ===== Helpers ===== */
function initials(name) {
  const words = String(name || "").trim().split(/\s+/).filter(Boolean);
  if (!words.length) return "--";
  if (words.length === 1) return words[0].substring(0, 2).toUpperCase();
  return (words[0][0] + words[words.length - 1][0]).toUpperCase();
}

let currentPhoto = "";

function paintAvatar(name) {
  const el = byId("avatarInitials");
  el.textContent = "";

  if (currentPhoto) {
    const img = document.createElement("img");
    img.src = currentPhoto;
    img.alt = "";
    el.appendChild(img);
  } else {
    el.textContent = initials(name);
  }
}

// Keep the sidebar in step with the saved account
function syncSidebar() {
  const p = Auth.profile();
  const avatar = byId("sideAvatar");

  byId("sideName").textContent = p.name || "";
  byId("sideEmail").textContent = p.email || p.phone || "";

  if (!avatar.querySelector("img")) avatar.textContent = initials(p.name);
}

/* ===== Phone numbers =====
   The page shows "+63" beside the box, so the box holds the 10 digits (9123456789).
   The account stores the local form (09123456789), same as sign up and login. */
function toInputPhone(stored) {
  const d = String(stored || "").replace(/\D/g, "");
  if (d.length === 12 && d.startsWith("63")) return d.slice(2);
  if (d.length === 11 && d.startsWith("0")) return d.slice(1);
  return d;
}

// Returns { value } (value is "" when empty) or { err: translation key }
function checkPhone(raw) {
  const s = String(raw || "").replace(/[\s\-().]/g, "").replace(/^\+/, "");

  if (!s) return { value: "" };
  if (!/^\d+$/.test(s)) return { err: "prof.err.digits" };

  let d = s;
  if (d.length === 12 && d.startsWith("63")) d = d.slice(2);
  else if (d.length === 11 && d.startsWith("0")) d = d.slice(1);

  if (d.length !== 10) return { err: "prof.err.len" };
  if (d[0] !== "9") return { err: "prof.err.ph" };

  return { value: "0" + d };
}

// All three dropdowns or none; the date must exist and not be in the future
function checkBirth(m, d, y) {
  if (!m && !d && !y) return "";
  if (!m || !d || !y) return "err.bday.incomplete";

  const year = Number(y), month = Number(m), day = Number(d);
  const date = new Date(year, month - 1, day);

  if (date.getFullYear() !== year || date.getMonth() !== month - 1 || date.getDate() !== day) {
    return "err.bday.invalid";
  }
  if (date > new Date()) return "err.bday.future";

  return "";
}

/* ===== Load the saved profile into the form ===== */
function loadProfile() {
  const acct = Auth.profile();
  const extra = Auth.getData("profileExtra", {}) || {};

  currentPhoto = acct.photo || "";

  byId("fullName").value = acct.name || "";
  byId("email").value = acct.email || "";
  byId("phone").value = toInputPhone(acct.phone);
  byId("altPhone").value = toInputPhone(extra.altPhone);
  byId("address").value = extra.address || "";
  byId("gender").value = extra.gender || "";
  byId("bdayMonth").value = extra.bdayMonth || "";
  byId("bdayDay").value = extra.bdayDay || "";
  byId("bdayYear").value = extra.bdayYear || "";

  paintAvatar(acct.name);
}

/* ===== Show / hide the two views ===== */
function showForm() {
  byId("successView").style.display = "none";
  byId("formView").style.display = "block";
  byId("fullName").focus();
}

function showSuccess() {
  byId("formView").style.display = "none";
  byId("successView").style.display = "flex";
  byId("backToEditBtn").focus();
}

byId("backToEditBtn").addEventListener("click", showForm);

// Initials follow the name while typing
byId("fullName").addEventListener("input", (e) => paintAvatar(e.target.value));

/* ===== Save ===== */
byId("userDetailsForm").addEventListener("submit", (e) => {
  e.preventDefault();
  clearAll();

  const name = byId("fullName").value.trim();
  const emailRaw = byId("email").value.trim();
  const email = emailRaw ? Auth.normalize(emailRaw) : "";
  const phone = checkPhone(byId("phone").value);
  const alt = checkPhone(byId("altPhone").value);
  const address = byId("address").value.trim();
  const gender = byId("gender").value;
  const m = byId("bdayMonth").value;
  const d = byId("bdayDay").value;
  const y = byId("bdayYear").value;

  const errors = {};

  if (!name) errors.name = "prof.err.name";
  if (email && !Auth.isEmail(email)) errors.email = "prof.err.email";
  if (phone.err) errors.phone = phone.err;
  if (alt.err) errors.altPhone = alt.err;

  // An account needs at least one way to be reached
  if (!errors.email && !errors.phone && !email && !phone.value) {
    errors.email = "prof.err.email.empty";
  }

  const bdayErr = checkBirth(m, d, y);
  if (bdayErr) errors.bday = bdayErr;

  const bad = FOCUS_ORDER.filter((k) => errors[k]);

  if (bad.length) {
    bad.forEach((k) => setErr(k, errors[k]));
    byId(FIELDS[bad[0]].input).focus();
    return;
  }

  // name / email / phone live in the account so every page's sidebar stays in sync
  const savedAccount = Auth.saveProfile({ name: name, email: email, phone: phone.value });
  const savedExtra = Auth.setData("profileExtra", {
    altPhone: alt.value,
    address: address,
    gender: gender,
    bdayMonth: m,
    bdayDay: d,
    bdayYear: y
  });

  if (!savedAccount || !savedExtra) {
    setErr("form", "err.save");
    return;
  }

  syncSidebar();
  paintAvatar(name);
  showSuccess();
});

/* ===== Start ===== */
fillDaysAndYears();
fillMonths();
paintLocal();
Auth.initSidebar();
loadProfile();

// Re-render everything that is written in code when the language changes
window.addEventListener("langchange", () => {
  paintLocal();
  fillMonths();
  repaintErrors();
});
  </script>
</body>
</html>
