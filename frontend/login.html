<!DOCTYPE html>
<html lang="en" data-guest-only>

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title data-i18n="log.doctitle">Login | MEDIC CARE</title>
  <script src="auth.js"></script>
  <script src="languages.js"></script>

  <style>
    /* ===== Base / variables ===== */
    :root {
      color-scheme: light;
      --blue: #5b7bd5;
      --link: #2a2ae0;
      --ink: #111;
      --line: #25305e;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      height: 100%;
      margin: 0;
      font-family: Inter, system-ui, sans-serif;
      color: var(--ink);
    }

    /* ===== Page layout ===== */
    .page {
      display: flex;
      min-height: 100vh;
      width: 100%;
      position: relative;
      overflow-y: auto;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #e6edf7 0%, #afc8f3 40%, #8cb0eb 100%);
      padding: 24px;
    }

    .left {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: auto;
    }

    .right {
      display: none;
    }

    .form {
      width: 100%;
      max-width: 420px;
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.4);
      border-radius: 20px;
      box-shadow: 0 12px 32px rgba(27, 58, 143, 0.15);
      padding: 44px 36px 36px;
    }

    h1 {
      font-size: 32px;
      margin: 0 0 6px;
      font-weight: 800;
      color: #0e2a7d;
    }

    .sub {
      font-size: 15px;
      margin: 0 0 32px;
      color: #4b5563;
    }

    label {
      display: block;
      font-size: 14px;
      font-weight: 700;
      margin: 0 0 8px;
      color: #1f2937;
    }

    .field {
      position: relative;
      margin-bottom: 22px;
    }

    input {
      width: 100%;
      height: 48px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: #ffffff;
      padding: 0 16px;
      font: inherit;
      font-size: 14px;
      outline: none;
      transition: all 0.2s ease;
    }

    input:focus {
      border-color: var(--blue);
      box-shadow: 0 0 0 3px rgba(47, 107, 246, 0.15);
    }

    input.err {
      border-color: #c0182b;
      background-color: #fef2f2;
    }

    .eye {
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: 0;
      cursor: pointer;
      padding: 6px;
      display: flex;
      color: #4b5563;
    }

    .msg {
      color: #c0182b;
      font-size: 12px;
      min-height: 16px;
      margin: -16px 0 12px 6px;
      font-weight: 500;
    }

    .forgot {
      display: block;
      text-align: right;
      font-size: 13px;
      margin: -14px 4px 28px 0;
      font-weight: 600;
    }

    a,
    .linkbtn {
      color: var(--link);
      text-decoration: none;
      cursor: pointer;
      background: none;
      border: 0;
      font: inherit;
      padding: 0;
    }

    a:hover,
    .linkbtn:hover {
      text-decoration: underline;
    }

    .btn {
      display: block;
      width: 100%;
      border: 0;
      border-radius: 12px;
      background: var(--blue);
      color: #fff;
      font: 700 15px Inter, sans-serif;
      height: 46px;
      cursor: pointer;
      transition: background 0.2s;
      box-shadow: 0 4px 12px rgba(47, 107, 246, 0.25);
    }

    .btn:hover {
      background: #1a56db;
    }

    .signup {
      text-align: center;
      font-size: 14px;
      margin-top: 24px;
      color: #4b5563;
    }

    .signup a {
      font-weight: 700;
      color: var(--link);
    }

    /* ===== Popups (forgot password / check email) ===== */
    .overlay {
      position: fixed;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      background: linear-gradient(90deg, #dcdcdc 0%, #d6d8de 25%, #7f9cf0 70%, #0b57e8 100%);
      padding: clamp(16px, 4vw, 32px);
      overflow-y: auto;
      z-index: 5;
    }

    .overlay.show {
      display: flex;
    }

    .card {
      width: 100%;
      max-width: 460px;
      max-height: calc(100vh - 32px);
      overflow-y: auto;
      background: linear-gradient(180deg, #a7b8f2, #dcdcdc);
      border: 1px solid #888;
      border-radius: 20px;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.24);
      padding: clamp(28px, 6vw, 44px);
      text-align: center;
    }

    .card h2 {
      margin: 0 0 12px;
      font-size: clamp(24px, 5vw, 30px);
      line-height: 1.2;
      font-weight: 700;
    }

    .card p {
      margin: 0 0 28px;
      font-size: 16px;
      line-height: 1.55;
    }

    .card .field {
      text-align: left;
      margin-bottom: 20px;
    }

    .card label {
      font-size: 15px;
      margin-bottom: 8px;
    }

    .card input {
      background: rgba(255, 255, 255, 0.25);
      font-style: italic;
      height: 54px;
      font-size: 16px;
    }

    .card input:not(:placeholder-shown) {
      font-style: normal;
    }

    .wide {
      width: 100%;
      min-height: 50px;
      border: 0;
      border-radius: 999px;
      background: #5b7bd5;
      color: #fff;
      font: 700 16px Inter, sans-serif;
      cursor: pointer;
    }

    .wide:hover {
      filter: brightness(1.08);
    }

    .back {
      display: inline-flex;
      gap: 8px;
      margin-top: 22px;
      font-size: 14px;
      color: var(--ink);
    }

    .mail {
      margin: 0 auto 8px;
      display: block;
    }

    .resend {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-top: 14px;
      font-size: 12px;
      background: none;
      border: 0;
      cursor: pointer;
      font-family: inherit;
    }

    .resend:disabled {
      opacity: 0.55;
      cursor: default;
    }

    /* ===== Toast message ===== */
    .toast {
      position: fixed;
      left: 50%;
      bottom: 24px;
      transform: translateX(-50%) translateY(20px);
      background: #222;
      color: #fff;
      font-size: 12px;
      padding: 10px 16px;
      border-radius: 999px;
      opacity: 0;
      transition: 0.25s;
      z-index: 20;
      pointer-events: none;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%);
    }

    /* ===== Responsive ===== */
    @media (max-width: 700px) {
      .right {
        display: none;
      }
    }

    @supports (height: 100dvh) {
      .card {
        max-height: calc(100dvh - 32px);
      }
    }

    @media (max-width: 420px) {
      .overlay {
        padding: 12px;
      }

      .card {
        max-height: calc(100vh - 24px);
        padding: 28px 22px;
      }
    }

    @supports (height: 100dvh) {
      @media (max-width: 420px) {
        .card {
          max-height: calc(100dvh - 24px);
        }
      }
    }
  </style>
</head>

<body>
  <div class="page">

    <div class="left">
      <form class="form" id="loginForm" novalidate>
        <h1 data-i18n="log.h1">Login</h1>
        <p class="sub" data-i18n="log.sub">Log in to your account.</p>

        <label for="email" data-i18n="log.id">Email</label>
        <div class="field">
          <input id="email" type="email" placeholder="Enter your email address" data-i18n-ph="log.id.ph"
            autocomplete="username">
        </div>
        <div class="msg" id="emailMsg"></div>

        <label for="pw" data-i18n="log.pw">Password</label>
        <div class="field">
          <input id="pw" type="password" placeholder="Enter your password" data-i18n-ph="log.pw.ph"
            autocomplete="current-password" style="padding-right:40px">
          <button type="button" class="eye" id="eye" aria-label="Show password">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#444" stroke-width="2">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8S1 12 1 12z" />
              <circle id="pupil" cx="12" cy="12" r="3" fill="#444" />
            </svg>
          </button>
        </div>
        <div class="msg" id="pwMsg"></div>

        <a class="forgot" href="#" id="forgotLink" data-i18n="log.forgot">Forgot Password?</a>

        <button class="btn" type="submit" data-i18n="log.btn">Sign In</button>

        <div class="signup">
          <span data-i18n="log.nosign">Don't have an account?</span>
          <a href="signup.html" id="signup" data-i18n="log.signup">Sign up</a>
        </div>
      </form>
    </div>

    <div class="right"></div>

    <!-- Forgot Password Modal -->
    <div class="overlay" id="forgotModal">
      <form class="card" id="forgotForm" novalidate>
        <h2 data-i18n="log.f.title">Forgot your password?</h2>
        <p data-i18n="log.f.desc">Enter your email so that we can send you a password reset link.</p>

        <div class="field">
          <label for="fEmail" data-i18n="log.f.label">Email</label>
          <input id="fEmail" type="email" placeholder="e.g., name@email.com" data-i18n-ph="log.f.ph">
          <div class="msg" id="fMsg" style="margin:6px 0 0 14px"></div>
        </div>

        <button class="wide" type="submit" data-i18n="log.f.send">Send Email</button>
        <button type="button" class="linkbtn back" id="backLogin" style="color:#111" data-i18n="log.f.back">&lt; Back to
          Login</button>
      </form>
    </div>

    <!-- Confirm login by e-mail -->
    <div class="overlay" id="verifyModal">
      <div class="card">
        <svg class="mail" width="42" height="36" viewBox="0 0 42 36" fill="none">
          <rect x="2" y="8" width="32" height="24" rx="3" fill="#fff" stroke="#111" stroke-width="3" />
          <path d="M3 11l15 11 15-11" stroke="#111" stroke-width="3" fill="none" />
          <circle cx="33" cy="9" r="8" fill="#111" />
          <path d="M29 9l3 3 5-6" stroke="#fff" stroke-width="2" fill="none" />
        </svg>
        <h2 data-i18n="log.v.title">Confirm it's you</h2>
        <p id="vDesc"></p>
        <button class="resend" id="vResend" type="button"><span id="vResendTxt" data-i18n="log.c.resend">Resend email</span></button>
        <button type="button" class="linkbtn back" id="vCancel" style="color:#111" data-i18n="log.v.cancel">Cancel</button>
      </div>
    </div>

    <!-- Check Email Modal -->
    <div class="overlay" id="checkModal">
      <div class="card">
        <svg class="mail" width="42" height="36" viewBox="0 0 42 36" fill="none">
          <rect x="2" y="8" width="32" height="24" rx="3" fill="#fff" stroke="#111" stroke-width="3" />
          <path d="M3 11l15 11 15-11" stroke="#111" stroke-width="3" fill="none" />
          <circle cx="33" cy="9" r="8" fill="#111" />
          <path d="M29 9l3 3 5-6" stroke="#fff" stroke-width="2" fill="none" />
        </svg>

        <h2 data-i18n="log.c.title">Check your email!</h2>
        <p id="checkDesc"></p>

        <button class="wide" id="openInbox" type="button" data-i18n="log.c.inbox">Open email inbox</button>

        <button class="resend" id="resend" type="button">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#111" stroke-width="2.5">
            <path d="M21 12a9 9 0 1 1-3-6.7" />
            <path d="M21 3v6h-6" />
          </svg>
          <span id="resendTxt" data-i18n="log.c.resend">Resend email</span>
        </button>
      </div>
    </div>

  </div>

  <div class="toast" id="toast"></div>

  <script>
    /* Login page. Needs auth.js and languages.js loaded first. */

    const byId = (id) => document.getElementById(id);

    /* ===== Settings ===== */
    const RESEND_SECONDS = 30;

    // "reason" values from Auth.verify() that mean the account does not exist.
    // Adjust to match what backend/app.py returns from /verify.
    const NOT_FOUND_REASONS = ["not_found", "none", "no_account", "no_user"];

    /* ===== Text that has no entry in languages.js yet ===== */
    const LOCAL = {
      "err.server": {
        en: "Open the app through its backend server: run `python backend/app.py`, then visit http://127.0.0.1:5000/login.html.",
        fil: "Buksan ang app sa backend server: patakbuhin ang `python backend/app.py`, saka pumunta sa http://127.0.0.1:5000/login.html."
      },
      "err.network": {
        en: "Can't reach the server. Check your connection and try again.",
        fil: "Hindi makakonekta sa server. Suriin ang iyong koneksyon at subukan muli."
      },
      "err.tooMany": {
        en: "Too many attempts. Please wait a moment and try again.",
        fil: "Masyadong maraming pagsubok. Maghintay muna at subukan muli."
      }
    };

    function t(key, vars) {
      if (LOCAL[key]) return LOCAL[key][I18N.getLang()] || LOCAL[key].en;
      return I18N.t(key, vars);
    }

    let toastTimer = null;
    let resendTimer = null;
    let resendLeft = 0;
    let sentEmail = "";

    /* ===== Toast ===== */
    function toast(msg) {
      const el = byId("toast");
      el.textContent = msg;
      el.classList.add("show");
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => el.classList.remove("show"), 2800);
    }

    /* ===== Modals ===== */
    function showModal(id) {
      ["forgotModal", "checkModal", "verifyModal"].forEach((m) => {
        byId(m).classList.toggle("show", m === id);
      });
    }

    const hideModals = () => { stopVerify(); showModal(null); };

    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape") hideModals();
    });

    /* ===== Show / hide password ===== */
    function paintEye() {
      const visible = byId("pw").type === "text";
      byId("pupil").setAttribute("fill", visible ? "none" : "#444");
      byId("eye").setAttribute("aria-label", t(visible ? "log.eye.hide" : "log.eye.show"));
    }

    byId("eye").addEventListener("click", () => {
      byId("pw").type = byId("pw").type === "text" ? "password" : "text";
      paintEye();
    });

    /* ===== Error helpers (errors are stored as translation keys) ===== */
    const errs = {}; // msgId -> translation key

    function setError(inputId, msgId, key) {
      errs[msgId] = key || null;
      byId(msgId).textContent = key ? t(key) : "";
      byId(inputId).classList.toggle("err", !!key);
    }

    function repaintErrors() {
      Object.keys(errs).forEach((msgId) => {
        if (errs[msgId]) byId(msgId).textContent = t(errs[msgId]);
      });
    }

    function clearErrors() {
      setError("email", "emailMsg", "");
      setError("pw", "pwMsg", "");
    }

    // Typing in a field clears only that field's error
    byId("email").addEventListener("input", () => setError("email", "emailMsg", ""));
    byId("pw").addEventListener("input", () => setError("pw", "pwMsg", ""));
    byId("fEmail").addEventListener("input", () => setError("fEmail", "fMsg", ""));

    /* ===== Login ===== */
    byId("loginForm").addEventListener("submit", (e) => {
      e.preventDefault();
      clearErrors();

      const raw = byId("email").value.trim();
      const pw = byId("pw").value;

      const emailErr = Auth.validId(raw) ? "" : "log.err.id";
      const pwErr = pw ? "" : "log.err.pw";

      setError("email", "emailMsg", emailErr);
      setError("pw", "pwMsg", pwErr);

      if (emailErr || pwErr) {
        byId(emailErr ? "email" : "pw").focus();
        return;
      }

      const id = Auth.normalize(raw);

      if (location.protocol === "file:") {
        setError("pw", "pwMsg", "err.server");
        byId("pw").focus();
        return;
      }

      // Step 1: check the password
      const check = Auth.verify(id, pw);

      if (!check.ok) {
        if (check.reason === "server_required") {
          setError("pw", "pwMsg", "err.server");
          byId("pw").focus();
        } else if (check.reason === "network") {
          setError("pw", "pwMsg", "err.network");
          byId("pw").focus();
        } else if (NOT_FOUND_REASONS.includes(check.reason)) {
          setError("email", "emailMsg", "log.err.none");
          byId("email").focus();
        } else if (check.reason === "email_unavailable") {
          setError("pw", "pwMsg", "err.emailfail");
          byId("pw").focus();
        } else if (check.reason === "too_many") {
          setError("pw", "pwMsg", "err.tooMany");
          byId("pw").focus();
        } else if (check.reason === "bad") {
          setError("pw", "pwMsg", "log.err.bad");
          byId("pw").focus();
        } else {
          setError("pw", "pwMsg", "err.fail");
          byId("pw").focus();
        }
        return;
      }

      // Step 1b: the server e-mailed a link. Wait until it is opened, then continue to step 2.
      if (check.needsEmail) {
        startVerify(check.id || id, check.email);
        return;
      }

      // Step 2: start the session
      const login = Auth.login(check.id || id);

      if (!login.ok) {
        if (NOT_FOUND_REASONS.includes(login.reason)) {
          setError("email", "emailMsg", "log.err.none");
          byId("email").focus();
        } else if (login.reason === "server_required") {
          setError("pw", "pwMsg", "err.server");
          byId("pw").focus();
        } else if (login.reason === "network") {
          setError("pw", "pwMsg", "err.network");
          byId("pw").focus();
        } else {
          setError("pw", "pwMsg", "err.fail");
          byId("pw").focus();
        }
        return;
      }

      location.href = Auth.HOME;
    });

    /* ===== Confirm login by e-mail link ===== */
    let verifyTimer = null, verifyId = "", verifyMail = "", vLeft = 0, vCooldown = null;

    function stopVerify() {
      clearInterval(verifyTimer); verifyTimer = null;
      clearInterval(vCooldown); vCooldown = null;
    }

    function paintVerify() {
      byId("vDesc").textContent = t("log.v.desc", { email: verifyMail });
      byId("vResendTxt").textContent = vLeft > 0 ? t("log.c.wait", { n: vLeft }) : t("log.c.resend");
    }

    function startVerify(id, maskedEmail) {
      verifyId = id; verifyMail = maskedEmail;
      vLeft = RESEND_SECONDS; byId("vResend").disabled = true;
      paintVerify();
      showModal("verifyModal");

      clearInterval(vCooldown);
      vCooldown = setInterval(() => {
        vLeft = Math.max(0, vLeft - 1);
        if (vLeft === 0) { clearInterval(vCooldown); byId("vResend").disabled = false; }
        paintVerify();
      }, 1000);

      clearInterval(verifyTimer);
      verifyTimer = setInterval(() => {
        Auth.loginStatus((s) => {
          if (!verifyTimer) return;
          if (s.expired) { stopVerify(); hideModals(); toast(t("log.v.expired")); return; }
          if (!s.confirmed) return;
          stopVerify();
          const r = Auth.login(verifyId);                 // the link was opened: start the session
          if (r.ok) { location.href = Auth.HOME; return; }
          hideModals();
          toast(t("err.fail"));
        });
      }, 3000);
    }

    byId("vResend").addEventListener("click", () => {
      if (byId("vResend").disabled) return;
      const r = Auth.resendLoginEmail();
      if (r.ok) { toast(t("log.t.resent")); startVerify(verifyId, verifyMail); }
      else toast(t(r.reason === "too_many" ? "err.tooMany" : "err.emailfail"));
    });
    byId("vCancel").addEventListener("click", hideModals);
    window.addEventListener("langchange", () => { if (verifyTimer) paintVerify(); });

    /* ===== Forgot password ===== */
    byId("forgotLink").addEventListener("click", (e) => {
      e.preventDefault();

      // Pre-fill with what the user already typed, if it is an email
      const typed = Auth.normalize(byId("email").value);
      byId("fEmail").value = Auth.isEmail(typed) ? typed : "";

      setError("fEmail", "fMsg", "");
      showModal("forgotModal");
      byId("fEmail").focus({ preventScroll: true });
    });

    byId("backLogin").addEventListener("click", hideModals);

    function paintResend() {
      byId("resendTxt").textContent = resendLeft > 0
        ? t("log.c.wait", { n: resendLeft })
        : t("log.c.resend");
    }

    function paintCheckDesc() {
      if (sentEmail) byId("checkDesc").textContent = t("log.c.desc", { email: sentEmail });
    }

    function startCooldown() {
      resendLeft = RESEND_SECONDS;
      byId("resend").disabled = true;
      paintResend();

      clearInterval(resendTimer);
      resendTimer = setInterval(() => {
        resendLeft -= 1;
        if (resendLeft <= 0) {
          resendLeft = 0;
          clearInterval(resendTimer);
          byId("resend").disabled = false;
        }
        paintResend();
      }, 1000);
    }

    byId("forgotForm").addEventListener("submit", (e) => {
      e.preventDefault();

      const email = Auth.normalize(byId("fEmail").value);

      if (!Auth.isEmail(email)) {
        setError("fEmail", "fMsg", "log.f.err");
        byId("fEmail").focus();
        return;
      }

      const r = Auth.requestReset(email);
      if (!r.ok) {
        setError("fEmail", "fMsg",
          r.reason === "too_many" ? "err.toomany" : r.reason === "network" ? "err.network" : "err.reset");
        return;
      }
      sentEmail = email;
      paintCheckDesc();
      showModal("checkModal");
      startCooldown();
    });

    byId("resend").addEventListener("click", () => {
      if (byId("resend").disabled) return;
      const r = Auth.requestReset(sentEmail);
      if (r.ok) {
        toast(t("log.t.resent"));
        startCooldown();
      } else {
        toast(t(r.reason === "too_many" ? "err.toomany" : "err.reset"));
      }
    });

    byId("openInbox").addEventListener("click", () => {
      location.href = "mailto:" + sentEmail;
    });

    /* ===== Re-render dynamic text when the language changes ===== */
    window.addEventListener("langchange", () => {
      repaintErrors();
      paintEye();
      paintResend();
      paintCheckDesc();
    });

    paintEye();

    /* ===== Message after signing up ===== */
    if (new URLSearchParams(location.search).get("created") === "1") {
      toast(t("log.t.created"));
    }
  </script>
</body>

</html>
