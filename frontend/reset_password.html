<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="rst.title">Medic Care | Reset Password</title>
    <script src="auth.js"></script>
    <script src="languages.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            min-height: 100vh;
            background: linear-gradient(
                to bottom,
                #ffffff 0%,
                #edf4fd 35%,
                #d5e5fa 70%,
                #bdd5f3 100%
            );
            color: #111827;
        }

        .signup-container {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 25px 18px;
        }

        .signup-form {
            width: 100%;
            max-width: 360px;
        }

        .signup-form h1 {
            font-size: 25px;
            text-align: center;
            margin-bottom: 5px;
        }

        .subtitle {
            text-align: center;
            font-size: 13px;
            color: #586273;
            margin-bottom: 28px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: bold;
            margin-bottom: 7px;
        }

        .form-group input {
            width: 100%;
            height: 43px;
            padding: 0 14px;
            border: 1px solid #78869b;
            border-radius: 25px;
            background: transparent;
            font-size: 12px;
            color: #111827;
            outline: none;
        }

        .form-group input::placeholder {
            color: #78869b;
        }

        .form-group input:focus {
            border-color: #1675b7;
            box-shadow: 0 0 0 2px #1675b726;
        }

        .create-button {
            display: block;
            margin: 22px auto 0;
            padding: 12px 25px;
            border: none;
            border-radius: 25px;
            background: #1675b7;
            color: white;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
        }

        .create-button:hover {
            background: #105d96;
        }

        .login-link {
            text-align: center;
            font-size: 12px;
            margin-top: 18px;
        }

        .login-link a {
            color: #245b9b;
            text-decoration: none;
            font-weight: bold;
        }

        .login-link a:hover {
            text-decoration: underline;
        }

        @media screen and (max-width: 480px) {
            .signup-form {
                max-width: 340px;
            }

            .signup-form h1 {
                font-size: 23px;
            }
        }

        .ok { color: #1a7f43; font-size: 13px; text-align: center; margin-top: 14px; }
        .msg {
            color: #c0182b;
            font-size: 11px;
            min-height: 14px;
            margin: 5px 0 0 14px;
        }

        .form-group input.invalid {
            border-color: #c0182b;
        }
    </style>
</head>
<body>
    <main class="signup-container">
        <form class="signup-form" id="resetForm" novalidate>
            <h1 data-i18n="rst.title">Choose a new password</h1>
            <p class="subtitle" data-i18n="rst.sub">Enter a new password for your account.</p>

            <div class="form-group">
                <label for="password" data-i18n="sig.pw">Password</label>
                <input type="password" id="password" placeholder="Create your password" data-i18n-ph="sig.pw.ph" autocomplete="new-password" required>
                <div class="msg" id="pwMsg"></div>
            </div>

            <div class="form-group">
                <label for="confirmPassword" data-i18n="sig.cf">Confirm Password</label>
                <input type="password" id="confirmPassword" placeholder="Confirm your password" data-i18n-ph="sig.cf.ph" autocomplete="new-password" required>
                <div class="msg" id="cfMsg"></div>
            </div>

            <div class="msg" id="formMsg" style="text-align:center;margin:0"></div>
            <button type="submit" class="create-button" id="submitBtn" data-i18n="rst.btn">Save new password</button>
            <p class="ok" id="okMsg" hidden></p>

            <p class="login-link">
                <a href="login.html" data-i18n="rst.back">Back to Login</a>
            </p>
        </form>
    </main>

    <script>
const byId = (id) => document.getElementById(id);
const token = new URLSearchParams(location.search).get("token") || "";
let formKey = "";                       // translation key of the message under the form

function paintForm() { byId("formMsg").textContent = formKey ? I18N.t(formKey) : ""; }
window.addEventListener("langchange", paintForm);

if (!token) { formKey = "rst.bad"; paintForm(); byId("submitBtn").disabled = true; }

byId("resetForm").addEventListener("submit", (e) => {
    e.preventDefault();
    formKey = ""; paintForm();
    ["pw", "cf"].forEach((k) => { byId(k + "Msg").textContent = ""; });

    const pw = byId("password").value, cf = byId("confirmPassword").value;
    let bad = "";
    if (pw.length < 8) bad = "sig.err.len";
    else if (!/[A-Za-z]/.test(pw) || !/\d/.test(pw)) bad = "sig.err.mix";
    if (bad) { byId("pwMsg").textContent = I18N.t(bad); byId("password").focus(); return; }
    if (pw !== cf) { byId("cfMsg").textContent = I18N.t("sig.err.match"); byId("confirmPassword").focus(); return; }

    const r = Auth.resetPassword(token, pw);
    if (!r.ok) {
        formKey = r.reason === "invalid_token" ? "rst.bad"
                : r.reason === "too_many" ? "err.toomany"
                : r.reason === "network" ? "err.network" : "rst.fail";
        paintForm();
        return;
    }
    byId("submitBtn").disabled = true;
    const ok = byId("okMsg"); ok.hidden = false; ok.textContent = I18N.t("rst.done");
    setTimeout(() => { location.href = "login.html"; }, 2500);
});
    </script>
</body>
</html>
